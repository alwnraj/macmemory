name: Build MacMemoryApp

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Build app
      run: |
        chmod +x build.sh
        ./build.sh
        
    - name: Create ZIP archive
      run: |
        cd build/Build/Products/Release
        zip -r MacMemoryApp.zip MacMemoryApp.app
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: MacMemoryApp
        path: build/Build/Products/Release/MacMemoryApp.zip
        
    - name: Upload to release (if release)
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: build/Build/Products/Release/MacMemoryApp.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

